[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "assistente-local"
version = "0.1.0"
description = "Hércules: assistente de voz local que conversa com o Claude Code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.187",
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "huggingface-hub>=0.30",
    "numpy>=2.0",
    "sounddevice>=0.5.2",
    "PySide6-Essentials>=6.8",
    "tomli-w>=1.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Só é preciso quando o PC não tem um CUDA reaproveitável (o app já usa o do VoiceStudio
# ou do CUDA Toolkit quando existem). Versões casadas com o cuDNN 9.10 do CTranslate2.
gpu = ["nvidia-cublas-cu12>=12.4,<13", "nvidia-cudnn-cu12>=9.10,<9.11"]
dev = ["pytest>=8"]

[project.gui-scripts]
hercules = "assistente_local.app:main"

[project.scripts]
hercules-console = "assistente_local.app:main_console"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
